[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code2flow"
version = "0.1.0"
description = "Similar to diagram as code but write flow to a file."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "NguyenVanThanhHust" }]

[tool.setuptools.packages.find]
where = ["src"]
